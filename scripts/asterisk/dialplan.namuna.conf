; ============================================================================
;  Target Zenit — Asterisk dialplan namunasi
;  Joyi: /etc/asterisk/extensions_target_zenit.conf
;  extensions.conf ichida: #include extensions_target_zenit.conf
; ============================================================================

[globals]
TZ_SCRIPTS=/usr/local/bin
; GoIP trunk nomi (pjsip.conf da ro'yxatdan o'tgan)
TZ_TRUNK=goip

; ---------------------------------------------------------------------------
;  Hangup handler — har qo'ng'iroq tugaganda metadatani navbatga yozadi.
;  Ichida HTTP so'rov yo'q: Asterisk qo'ng'iroq yo'lida tarmoqni kutmasligi
;  kerak. Yuborishni telefoniya-yuklovchi.timer bajaradi.
; ---------------------------------------------------------------------------
[tz-hangup]
exten => s,1,NoOp(Qo'ng'iroq tugadi: ${UNIQUEID})
 same => n,Set(TZ_ANSWER=${IF($["${CDR(answer)}" != ""]?${EPOCH_ANSWER}:0)})
 same => n,System(${TZ_SCRIPTS}/qongiroq_tugadi.sh "${UNIQUEID}" "${TZ_YONALISH}" "${TZ_ICHKI}" "${TZ_TASHQI}" "${TZ_KANAL}" "${TZ_BOSHLANDI}" "${TZ_JAVOB}" "${EPOCH}" "${CDR(billsec)}" "${TZ_STATUS}" "${TZ_KIM_TUGATDI}")
 same => n,Return()

; ---------------------------------------------------------------------------
;  CHIQUVCHI — menejer CRM'dan yoki softphone'dan raqam teradi
; ---------------------------------------------------------------------------
[tz-chiquvchi]
exten => _X.,1,NoOp(Chiquvchi: ${EXTEN} <- ${CALLERID(num)})
 same => n,Set(TZ_YONALISH=outgoing)
 same => n,Set(TZ_ICHKI=${CALLERID(num)})
 same => n,Set(TZ_TASHQI=${EXTEN})
 same => n,Set(TZ_BOSHLANDI=${EPOCH})
 same => n,Set(TZ_JAVOB=0)
 same => n,Set(TZ_KANAL=${TZ_TRUNK})

 ; Qonuniy ogohlantirish — "Shaxsiy ma'lumotlar to'g'risida"gi qonun talabi.
 ; Ota-onaga emas, MENEJERGA eshitiladi (chiquvchi qo'ng'iroqda mijozga
 ; ogohlantirish berish uchun alohida IVR kerak — 3-bosqichda qo'shiladi).
 same => n,Playback(${TZ_OGOHLANTIRISH}&silence/1)

 ; Stereo yozuv: chap kanal = menejer, o'ng kanal = mijoz.
 ; Bu "kim gapirdi" masalasini bepul hal qiladi. Keyin stereoga o'tib
 ; bo'lmaydi — yozuv bir marta yoziladi, shuning uchun BOSHIDAN stereo.
 same => n,Set(MIXMONITOR_FILENAME=${UNIQUEID}.wav)
 same => n,MixMonitor(${UNIQUEID}.wav,b,${TZ_SCRIPTS}/yozuvni_tayyorla.sh "${UNIQUEID}.wav" "${UNIQUEID}")

 same => n,Set(CHANNEL(hangup_handler_push)=tz-hangup,s,1)
 same => n,Dial(PJSIP/${EXTEN}@${TZ_TRUNK},60)
 same => n,Set(TZ_STATUS=${DIALSTATUS})
 same => n,Hangup()

; ---------------------------------------------------------------------------
;  KIRUVCHI — ota-ona GoIP orqali qo'ng'iroq qildi
; ---------------------------------------------------------------------------
[tz-kiruvchi]
exten => _X.,1,NoOp(Kiruvchi: ${CALLERID(num)})
 same => n,Set(TZ_YONALISH=incoming)
 same => n,Set(TZ_TASHQI=${CALLERID(num)})
 same => n,Set(TZ_BOSHLANDI=${EPOCH})
 same => n,Set(TZ_JAVOB=0)
 same => n,Set(TZ_KANAL=${CHANNEL(name)})

 ; CRM'dan so'raymiz: bu raqam kimning mijozi. Javobdagi ichki raqamga
 ; uzatamiz — ota-ona o'zining menejeriga tushadi.
 ; (3-bosqich: curl o'rniga AGI, timeout nazorati bilan)
 same => n,Set(TZ_ICHKI=${SHELL(${TZ_SCRIPTS}/kimga.sh "${CALLERID(num)}")})
 same => n,Set(TZ_ICHKI=${IF($["${TZ_ICHKI}" = ""]?${TZ_NAVBAT}:${TZ_ICHKI})})

 same => n,Set(MIXMONITOR_FILENAME=${UNIQUEID}.wav)
 same => n,MixMonitor(${UNIQUEID}.wav,b,${TZ_SCRIPTS}/yozuvni_tayyorla.sh "${UNIQUEID}.wav" "${UNIQUEID}")

 same => n,Set(CHANNEL(hangup_handler_push)=tz-hangup,s,1)
 same => n,Dial(PJSIP/${TZ_ICHKI},30)
 same => n,Set(TZ_STATUS=${DIALSTATUS})
 same => n,Hangup()
